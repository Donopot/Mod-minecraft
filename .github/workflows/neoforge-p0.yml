name: NeoForge P0 contract
on:
  push:
    branches: [neoforge]
  pull_request:
    branches: [neoforge]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Check frozen source and migration boundaries
        run: |
          python3 scripts/neoforge/verify_contract.py
          python3 -m unittest discover -s scripts/neoforge/tests -v
      - name: Compile the future P3 GameTest with pinned NeoForge
        run: |
          chmod +x scripts/neoforge/p0-compiler/gradlew
          scripts/neoforge/p0-compiler/gradlew --no-daemon -p scripts/neoforge/p0-compiler classes
      - uses: actions/upload-artifact@v7
        with:
          name: neoforge-p0-compiled-contract-test
          path: scripts/neoforge/p0-compiler/build/classes/java/main/
