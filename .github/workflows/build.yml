name: Servitor build and tests
on: [pull_request, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: voiddynasty
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore bundled GeckoLib dependency
        run: |
          mkdir -p libs
          cp ../client-local/voiddynasty-1.3.0-alpha.5/mods/geckolib-fabric-26.3-5.5.7.jar libs/
      - name: Build and test inventory conservation
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Test mission and observation tools
        run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: voiddynasty
          path: voiddynasty/build/libs/
